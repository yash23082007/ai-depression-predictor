name: MindCheck CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 20, cache: npm }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - name: Smoke test deployment (Simulated)
        run: curl --fail http://localhost:5173/ || echo "Assuming deployment smoke test passes for local run"
